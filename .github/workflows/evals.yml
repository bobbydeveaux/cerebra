name: Eval Suite

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  eval:
    name: Eval Suite
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Build with the sqlite_fts5 tag so chunks_fts is created; the eval
      # suite exercises the FTS retrieval path and needs the index present.
      - name: Build
        run: make build

      # Retrieval-only: seeds an ephemeral DB from embedded fixtures, runs
      # FTS search per question, prints the pass/fail count, and exits
      # non-zero when the pass rate drops below 70%. No API keys required.
      - name: Run eval suite
        run: ./cerebra eval --ci --threshold 0.70
