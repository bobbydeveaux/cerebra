name: Test Cerebra

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: go test (sqlite_fts5)
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # mattn/go-sqlite3 gates FTS5 behind the `sqlite_fts5` build tag.
      # The Makefile sets that tag for both vet and test. Bare `go test ./...`
      # would fail with "no such table: chunks_fts" in TestSearchFTS.
      - name: Vet
        run: make vet

      - name: Test
        run: make test
