{{template "layout" .}}
{{define "content"}}
<h1>Chat with Jor-El</h1>

<div class="chat-container">
    <div id="chat-messages" class="chat-messages"></div>

    <form id="chat-form" class="chat-form" onsubmit="sendMessage(event)">
        <input type="text" id="chat-input" placeholder="Ask Jor-El about the codebase..." autofocus>
        <button type="submit">Send</button>
    </form>

    <details class="api-key-row" style="margin-top: 8px; font-size: 0.85em;">
        <summary id="api-key-summary">API key</summary>
        <div style="margin-top: 6px;">
            <input type="password" id="api-key-input" placeholder="ck_..." style="width: 70%;">
            <button type="button" onclick="saveApiKey()">Save</button>
            <button type="button" onclick="clearApiKey()">Clear</button>
            <div id="api-key-status" style="margin-top: 4px; color: #666;"></div>
        </div>
    </details>
</div>

<script>
var chatHistory = [];

function refreshApiKeyStatus() {
    var status = document.getElementById('api-key-status');
    var summary = document.getElementById('api-key-summary');
    if (!status || !summary) return;
    try {
        var k = window.localStorage.getItem('cerebra_api_key');
        if (k) {
            status.textContent = 'Stored: ' + k.slice(0, 4) + '...' + k.slice(-4);
            summary.textContent = 'API key (saved)';
        } else {
            status.textContent = 'No key stored. Required when CEREBRA_FREE_TIER_ENABLED=false.';
            summary.textContent = 'API key';
        }
    } catch (_) {
        status.textContent = 'localStorage unavailable in this browser.';
    }
}

function saveApiKey() {
    var input = document.getElementById('api-key-input');
    if (!input) return;
    var k = input.value.trim();
    try {
        if (k) {
            window.localStorage.setItem('cerebra_api_key', k);
        } else {
            window.localStorage.removeItem('cerebra_api_key');
        }
        input.value = '';
    } catch (_) {}
    refreshApiKeyStatus();
}

function clearApiKey() {
    try { window.localStorage.removeItem('cerebra_api_key'); } catch (_) {}
    refreshApiKeyStatus();
}

// Codex pass 3 [P1]: do NOT ingest the API key from the URL. Query strings
// land in browser history, server access logs, and Referer headers, so a
// `?key=ck_...` landing page is a leak surface even if JS strips it after
// the fact. Operators who want to hand off a key after a Stripe redirect
// should land users on a dedicated welcome page that prompts for the key
// (or POSTs it to a session endpoint over HTTPS) — that flow is out of
// scope for the chat page itself.
refreshApiKeyStatus();

function sendMessage(e) {
    e.preventDefault();
    const input = document.getElementById('chat-input');
    const messages = document.getElementById('chat-messages');
    const query = input.value.trim();
    if (!query) return;

    chatHistory.push({role: 'user', content: query});

    // Add user message
    const userMsg = document.createElement('div');
    userMsg.className = 'message user-message';
    userMsg.textContent = query;
    messages.appendChild(userMsg);

    // Add assistant message placeholder
    const assistantMsg = document.createElement('div');
    assistantMsg.className = 'message assistant-message';
    messages.appendChild(assistantMsg);

    input.value = '';
    messages.scrollTop = messages.scrollHeight;

    // Build URL with history for context. The API key NEVER appears in the
    // URL — Codex pass 3 [P1] flagged URL-borne credentials as a leak risk
    // (logs, history, referrers). We use fetch() + ReadableStream so the
    // request can carry an `Authorization: Bearer` header, which neither
    // EventSource nor a query param can match for confidentiality.
    var url = '/api/chat/stream?q=' + encodeURIComponent(query);
    if (chatHistory.length > 1) {
        url += '&history=' + encodeURIComponent(JSON.stringify(chatHistory.slice(0, -1)));
    }

    var headers = { 'Accept': 'text/event-stream' };
    try {
        var cerebraKey = window.localStorage.getItem('cerebra_api_key');
        if (cerebraKey) {
            headers['Authorization'] = 'Bearer ' + cerebraKey;
        }
    } catch (_) { /* localStorage may be disabled; fall through */ }

    var fullResponse = '';
    var controller = new AbortController();

    function finalise() {
        if (fullResponse) chatHistory.push({role: 'assistant', content: fullResponse});
    }

    fetch(url, { method: 'GET', headers: headers, signal: controller.signal })
        .then(function(resp) {
            if (!resp.ok || !resp.body) {
                assistantMsg.textContent = 'Error: ' + resp.status + ' ' + resp.statusText;
                return;
            }
            var reader = resp.body.getReader();
            var decoder = new TextDecoder('utf-8');
            var buffer = '';
            function pump() {
                return reader.read().then(function(result) {
                    if (result.done) {
                        finalise();
                        return;
                    }
                    buffer += decoder.decode(result.value, { stream: true });
                    // Server-sent events are delimited by a blank line; each
                    // event has zero or more `data:` lines. We rebuild that
                    // here because fetch() doesn't parse SSE for us.
                    var idx;
                    while ((idx = buffer.indexOf('\n\n')) !== -1) {
                        var rawEvent = buffer.slice(0, idx);
                        buffer = buffer.slice(idx + 2);
                        var dataLines = rawEvent.split('\n')
                            .filter(function(l) { return l.indexOf('data:') === 0; })
                            .map(function(l) { return l.slice(5).replace(/^ /, ''); });
                        if (dataLines.length === 0) continue;
                        var data = dataLines.join('\n');
                        if (data === '[DONE]') {
                            controller.abort();
                            finalise();
                            return;
                        }
                        fullResponse += data;
                        assistantMsg.textContent = fullResponse;
                        messages.scrollTop = messages.scrollHeight;
                    }
                    return pump();
                });
            }
            return pump();
        })
        .catch(function(err) {
            if (err && err.name === 'AbortError') return;
            finalise();
        });
}
</script>
{{end}}
